<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPK Pemilihan Mobil Bekas</title>
    <!-- External CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-container h2 {
            font-weight: 700;
            margin-bottom: 30px;
            color: #0dcaf0;
        }
        .form-control {
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-control:focus {
            background-color: rgba(255,255,255,0.15);
            border-color: #0dcaf0;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
        }
        .form-control::placeholder {
            color: #adb5bd;
        }
        .btn-login {
            background-color: #0dcaf0;
            color: #000;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-login:hover {
            background-color: #31d2f2;
            transform: translateY(-2px);
        }
        .login-icon {
            font-size: 3rem;
            color: #0dcaf0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="animate__animated animate__fadeIn">

    <div class="login-container glass-panel">
        <i class="fa-solid fa-user-shield login-icon animate__animated animate__pulse animate__infinite"></i>
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="mb-3 text-start">
                <label for="username" class="form-label text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-info"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username..." required>
                </div>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-info"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password..." required>
                </div>
            </div>
            <button type="submit" class="btn btn-login">Login <i class="fa-solid fa-right-to-bracket ms-1"></i></button>
        </form>
        <div class="mt-4 fs-14 text-secondary">
            &copy; 2026 Duta Agung Pramana
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Check if already logged in
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === 'admin') {
                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil!',
                    text: 'Selamat datang di Dashboard SPK.',
                    background: '#1e1e2d',
                    color: '#fff',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    window.location.href = 'index.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Gagal',
                    text: 'Username atau Password salah!',
                    background: '#1e1e2d',
                    color: '#fff',
                    confirmButtonColor: '#0dcaf0'
                });
            }
        });
    </script>
</body>
</html>
